name: Build and Deploy

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: eu-west-2
  ECR_REGISTRY: 057133611121.dkr.ecr.eu-west-2.amazonaws.com
  ECR_REPOSITORY: kanban-api
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region eu-west-2 | docker login --username AWS --password-stdin 057133611121.dkr.ecr.eu-west-2.amazonaws.com
            docker pull 057133611121.dkr.ecr.eu-west-2.amazonaws.com/kanban-api:latest
            docker stop kanban-api || true
            docker rm kanban-api || true
            docker run -d \
              --name kanban-api \
              --restart unless-stopped \
              -p 8080:8080 \
              -e KANBOARD_API_TOKEN=${{ secrets.KANBOARD_API_TOKEN }} \
              057133611121.dkr.ecr.eu-west-2.amazonaws.com/kanban-api:latest
