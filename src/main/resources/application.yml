server:
  port: 8080

spring:
  ai:
    mcp:
      server:
        name: kanboard
        version: 0.0.1
        type: SYNC
        protocol: STREAMABLE

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

kanboard:
  url: ${KANBOARD_URL:@kanboard.default.url@}
  api-token: ${KANBOARD_API_TOKEN:}
  username: ${KANBOARD_USERNAME:@kanboard.default.username@}
