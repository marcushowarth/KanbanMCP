name: Build and Deploy

on:
  push:
    branches: [ main ]
    paths-ignore:        # don't redeploy the app for doc/workflow-only changes
      - '**.md'
      - '.github/**'
  workflow_dispatch:     # manual trigger — needed since .github/** is push-ignored above,
                          # so changes to this very file (e.g. testing a caching tweak)
                          # can't self-trigger a run any other way

permissions:
  contents: read
  packages: write   # GHCR push via the built-in GITHUB_TOKEN — no PAT to manage

env:
  IMAGE: ghcr.io/marcushowarth/kanban-mcp
  IMAGE_TAG: ${{ github.sha }}
  HOST_PORT: "8080"          # Caddy proxies mcp.howarth.eu/kanban/* -> 127.0.0.1:8080

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Resolve Mandrel builder image digest
        id: mandrel
        run: |
          DIGEST=$(docker manifest inspect quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25 | sha256sum | cut -d' ' -f1)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Cache Mandrel builder image
        id: cache-mandrel
        uses: actions/cache@v6
        with:
          path: /tmp/mandrel-image.tar
          key: mandrel-builder-jdk25-${{ steps.mandrel.outputs.digest }}

      - name: Load cached Mandrel builder image
        if: steps.cache-mandrel.outputs.cache-hit == 'true'
        run: docker load -i /tmp/mandrel-image.tar

      - name: Pull and cache Mandrel builder image
        if: steps.cache-mandrel.outputs.cache-hit != 'true'
        run: |
          docker pull quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25
          docker save quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25 -o /tmp/mandrel-image.tar

      - name: Build native image + run native integration test
        run: >
          ./mvnw --batch-mode verify -Dnative
          -Dquarkus.native.container-build=true
          -Dquarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25

      - name: Login to GHCR
        uses: docker/login-action@v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -f src/main/docker/Dockerfile.native \
            -t $IMAGE:$IMAGE_TAG .
          docker tag $IMAGE:$IMAGE_TAG $IMAGE:latest
          docker push $IMAGE:$IMAGE_TAG
          docker push $IMAGE:latest

      - name: Stamp the build time
        id: built
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Hetzner
        run: |
          echo "${{ secrets.HETZNER_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            deploy@${{ secrets.HETZNER_HOST }} \
            "set -e
            test -r /opt/kanban-mcp/kanban-mcp.env || { echo 'kanban-mcp.env missing or unreadable, keeping the running container'; exit 1; }
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            docker stop kanban-mcp || true
            docker rm kanban-mcp || true
            docker run -d \
              --name kanban-mcp \
              --restart always \
              -p 127.0.0.1:${{ env.HOST_PORT }}:8080 \
              -e KANBOARD_API_TOKEN='${{ secrets.KANBOARD_API_TOKEN }}' \
              -e APP_BUILD_NUMBER='${{ github.run_number }}' \
              -e APP_GIT_SHA='${{ github.sha }}' \
              -e APP_BUILT_AT='${{ steps.built.outputs.at }}' \
              --env-file /opt/kanban-mcp/kanban-mcp.env \
              ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            docker images --format '{{.Repository}}:{{.Tag}}' ${{ env.IMAGE }} | grep -v ':${{ env.IMAGE_TAG }}$' | xargs -r docker rmi || true
            docker image prune -f
            docker logout ghcr.io"
          rm -f /tmp/deploy_key

      - name: Health-check the freshly deployed container
        run: |
          echo "${{ secrets.HETZNER_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          for i in $(seq 1 12); do
            if ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no deploy@${{ secrets.HETZNER_HOST }} \
                "curl -sf -m 5 http://localhost:${{ env.HOST_PORT }}/kanban/q/health"; then
              echo "Healthy after $i attempt(s)."
              # Healthy is not enough: the build answering must be this commit
              LIVE=$(ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no deploy@${{ secrets.HETZNER_HOST }} \
                "curl -sf -m 5 http://localhost:${{ env.HOST_PORT }}/kanban/version") || LIVE=""
              echo "Running: $LIVE"
              rm -f /tmp/deploy_key
              echo "$LIVE" | grep -q "\"gitSha\":\"${{ github.sha }}\"" || { echo "::error::The container is up but is not this commit (${{ github.sha }})"; exit 1; }
              exit 0
            fi
            echo "Not up yet (attempt $i), retrying..."
            sleep 5
          done
          echo "Container never became healthy"
          rm -f /tmp/deploy_key
          exit 1
