server:
  port: 8080

spring:
  ai:
    mcp:
      server:
        name: kanboard
        version: 0.0.1
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          keep-alive-interval: 15s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

kanboard:
  url: ${KANBOARD_URL:https://kanban.howarth.eu/jsonrpc.php}
  api-token: ${KANBOARD_API_TOKEN:}
  username: ${KANBOARD_USERNAME:claude}
